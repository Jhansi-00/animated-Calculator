<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url(bgn3.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            overflow: hidden;
            flex-direction: column;
        }
        .calculator {
            width: 280px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
            
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .display {
            width: 100%;
            height: 50px;
            text-align: right;
            font-size: 1.8em;
            margin-bottom: 15px;
            border: none;
            padding: 10px;
            border-radius: 10px;
            background: #f4f4f4;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            width: 100%;
            height: 60px;
            font-size: 1.4em;
            border: none;
            cursor: pointer;
            background: #ff9a9e;
            color: white;
            border-radius: 10px;
            transition: all 0.3s ease-in-out;
        }
        button:hover {
            background: #ff6b81;
            transform: scale(1.1);
        }
        button:active {
            background: #ff4757;
            transform: scale(1);
        }
        .history {
            width: 280px;
            margin-top: 20px;
            padding: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            max-height: 150px;
            overflow-y: auto;
        }
        .row-1{
            background-image: linear-gradient(to bottom right, pink, rgb(215, 240, 177));
        }
        .row-2{
            background-image: linear-gradient(to bottom right,rgb(171, 171, 244),white);
        }
        .row-3{
            background-image: linear-gradient(to bottom right,rgb(249, 213, 145),rgb(144, 217, 246));
        }
        .row-4{
            background-image: linear-gradient(to bottom right,rgb(236, 241, 241),rgb(180, 106, 152));
        }
        .row-5{
            background-image: linear-gradient(to bottom right,rgb(222, 250, 110),rgb(135, 180, 235));
        }
      
        .btn{
            border: none;
            color: black;
            width: 100px;
            margin-top: 20px;
            background-color: white;
           
        }
        .btn:hover{
            background-color: rgb(251, 249, 252);
            text-decoration: underline;
            color: black;


        }
    </style>
</head>
<body>
    
    
    <div class="calculator">
        <input type="text" id="display" class="display" disabled>
        <div class="buttons">
            <button class="row-1" onclick="clearDisplay()">C</button>
            <button class="row-1" onclick="resetCalculator()">Reset</button>
            <button class="row-1" onclick="appendValue('/')">/</button>
            <button class="row-1" onclick="appendValue('*')">*</button>
            <button class="row-2" onclick="appendValue('7')">7</button>
            <button class="row-2" onclick="appendValue('8')">8</button>
            <button class="row-2" onclick="appendValue('9')">9</button>
            <button class="row-2" onclick="appendValue('-')">-</button>
            <button class="row-3" onclick="appendValue('4')">4</button>
            <button class="row-3" onclick="appendValue('5')">5</button>
            <button class="row-3" onclick="appendValue('6')">6</button>
            <button class="row-3" onclick="appendValue('+')">+</button>
            <button class="row-4" onclick="appendValue('1')">1</button>
            <button class="row-4" onclick="appendValue('2')">2</button>
            <button class="row-4" onclick="appendValue('3')">3</button>
            <button class="row-4" onclick="calculateResult()">=</button>
            <button class="row-5" onclick="appendValue('0')">0</button>
            <button class="row-5" onclick="appendValue('.')">.</button>
        </div>
    </div>
    <div class="history">
        <h3>Calculation History</h3>
        <ul id="historyList"></ul>
    </div>
    <button class="btn" onclick="window.location.href='index.html'">Home</button>
       
      
       
    
    
    <script>
        
        let history = [];

        function appendValue(value) {
            document.getElementById("display").value += value;
        }
        
        function clearDisplay() {
            document.getElementById("display").value = "";
        }
        
        function resetCalculator() {
            document.getElementById("display").value = "";
            history = [];
            updateHistory();
        }
        
        function calculateResult() {
            try {
                let result = eval(document.getElementById("display").value);
                let expression = document.getElementById("display").value + " = " + result;
                document.getElementById("display").value = result;
                history.push(expression);
                updateHistory();
            } catch {
                alert("Invalid expression");
            }
        }
        
        function updateHistory() {
            let historyList = document.getElementById("historyList");
            historyList.innerHTML = "";
            history.slice(-5).forEach(item => {
                let li = document.createElement("li");
                li.textContent = item;
                historyList.appendChild(li);
            });
        }
    </script>
</body>
</html>
